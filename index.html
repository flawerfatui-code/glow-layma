<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glow Layma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma}
body{background:#fff0f6}
header{background:linear-gradient(135deg,#81a365,#82c7ab);color:#fff;padding:20px;text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1);text-align:center;padding-bottom:10px;cursor:pointer}
.card img{width:100%;height:200px;object-fit:cover}
.card h3{font-size:14px;margin:8px;height:35px;overflow:hidden}
.price{color:#e91e63;font-weight:bold}
.profit{background:#e8f5e9;color:#2e7d32;padding:3px 8px;border-radius:10px;font-size:12px}
.btn{background:#81a365;color:#fff;padding:10px;margin:10px;border-radius:25px;border:none;width:90%;cursor:pointer}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:999;overflow-y:auto}
.modal-box{background:#fff;width:95%;max-width:500px;margin:20px auto;border-radius:20px;padding:15px;position:relative}
.gallery{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.gallery img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}
.gallery img.active{border-color:#e91e63}
#mainImg{width:100%;height:350px;object-fit:cover;border-radius:15px}
.video{width:100%;height:250px;border-radius:15px;margin:10px 0;border:none}
.close{position:absolute;left:15px;top:10px;font-size:26px;cursor:pointer}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
</style></head>
<body>
<header><h1>Glow Layma - منتجات ترند 2026</h1></header>
<div id="products" class="products">تحميل...</div>
<div id="modal"><div class="modal-box">
<span class="close" onclick="closeM()">&times;</span>
<img id="mainImg" src="">
<div class="gallery" id="gallery"></div>
<h2 id="mName"></h2>
<p id="mPrice" style="color:#e91e63;font-weight:bold;font-size:20px"></p>
<p id="mRating" style="color:#ff9800"></p>
<p id="mDesc" style="margin:10px 0;line-height:1.6"></p>
<div id="videoBox"></div>
<h3>اطلبي الآن:</h3>
<input id="cName" placeholder="الاسم الكامل">
<input id="cPhone" placeholder="رقم الواتساب">
<input id="cCity" placeholder="المدينة والعنوان">
<button class="btn" onclick="sendOrder()">تأكيد عبر واتساب</button>
</div></div>
<script>
let all=[],cur=null;
fetch('products.json?v='+Date.now()).then(r=>r.json()).then(d=>{
all=d;let h='';
d.forEach((p,i)=>{
let img=p['صورة']||p.صورة||''; let name=p['اسم']||p.اسم;let price=p['سعر']||p.سعر;
h+=`<div class="card" onclick="openM(${i})"><img src="${img}"><h3>${name}</h3><div class="price">${price} $</div><div class="profit">ربحك: ${p['ربح']||p.ربح} $</div><button class="btn">شوفي التفاصيل</button></div>`;
});
document.getElementById('products').innerHTML=h;
});
function openM(i){
cur=all[i];document.getElementById('mName').innerText=cur['اسم']||cur.اسم;
document.getElementById('mPrice').innerText=(cur['سعر']||cur.سعر)+' $';
document.getElementById('mRating').innerText=cur['تقييم']||'⭐ 4.8';
document.getElementById('mDesc').innerText=cur['وصف']||cur.وصف||'';
let imgs=cur['صور']||cur.صور||[cur['صورة']||cur.صورة];
document.getElementById('mainImg').src=imgs[0];
let g='';imgs.forEach((im,idx)=>{g+=`<img src="${im}" class="${idx==0?'active':''}" onclick="document.getElementById('mainImg').src='${im}';document.querySelectorAll('.gallery img').forEach(x=>x.classList.remove('active'));this.classList.add('active')">`;});
document.getElementById('gallery').innerHTML=g;
let v=cur['فيديو']||cur.فيديو||'';document.getElementById('videoBox').innerHTML=v?`<iframe class="video" src="${v}" allowfullscreen></iframe>`:'';
document.getElementById('modal').style.display='block';
}
function closeM(){document.getElementById('modal').style.display='none';}
function sendOrder(){
let n=document.getElementById('cName').value,ph=document.getElementById('cPhone').value,ci=document.getElementById('cCity').value;
if(!n||!ph||!ci){alert('عمري المعلومات');return;}
let msg=`طلب جديد Glow Layma:%0A🛍️ ${cur['اسم']||cur.اسم}%0A💰 ${cur['سعر']||cur.سعر} $%0A👤 ${n}%0A📱 ${ph}%0A📍 ${ci}`;
window.open(`https://wa.me/212600000000?text=${msg}`,'_blank'); // بدلي النمرة
closeM();
}
</script>
</body>
</html>
