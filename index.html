<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Layma - منتجات ترند 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff5f7}
.header{background:linear-gradient(135deg,#a8e6a3,#f8c8dc);padding:20px;text-align:center;color:#fff;font-size:24px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover}
.card-body{padding:9px}
.card-title{font-size:13px;font-weight:bold;height:36px;overflow:hidden}
.card-price{color:#e91e63;font-weight:bold;margin-top:4px;font-size:15px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;padding:10px;overflow:auto}
.modal-content{background:#fff;border-radius:18px;max-width:500px;margin:15px auto;padding:14px;position:relative}
.main-img{width:100%;height:380px;object-fit:cover;border-radius:14px;background:#f5f5f5}
.thumbs{display:flex;gap:7px;margin-top:10px;overflow:auto}
.thumbs img{width:70px;height:70px;border-radius:9px;object-fit:cover;border:3px solid transparent;cursor:pointer;flex-shrink:0}
.thumbs img.active{border-color:#e91e63}
.close{position:absolute;top:8px;left:12px;font-size:26px;background:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.btn{width:100%;padding:13px;background:#25D366;color:#fff;border:none;border-radius:11px;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header">Glow Layma - منتجات ترند 2026 ✨</div>
<div class="container" id="grid"></div>
<div class="modal" id="modal" onclick="if(event.target==this) this.style.display='none'">
  <div class="modal-content">
    <div class="close" onclick="document.getElementById('modal').style.display='none'">✕</div>
    <img id="mImg" class="main-img" src="">
    <div class="thumbs" id="mThumbs"></div>
    <h3 id="mName" style="margin-top:12px"></h3>
    <div id="mPrice" style="font-size:22px;color:#e91e63;font-weight:bold;margin:6px 0"></div>
    <div id="mDesc" style="background:#fff5f7;padding:10px;border-radius:10px;line-height:1.6;color:#444;font-size:14px"></div>
    <button class="btn" id="waBtn">اطلبي واتساب 💬</button>
  </div>
</div>
<script>
let all=[]
function show(list){
 const g=document.getElementById('grid'); g.innerHTML='';
 list.forEach((p,i)=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<img src="${p.صورة}"><div class="card-body"><div class="card-title">${p.اسم}</div><div class="card-price">${p.سعر} درهم</div><div style="font-size:11px;color:#888">${p.تقييم}</div></div>`;
  d.onclick=()=>openM(i); g.appendChild(d);
 });
}
function openM(i){
 const p=all[i]; document.getElementById('modal').style.display='block';
 document.getElementById('mImg').src=p.صور[0]; document.getElementById('mName').innerText=p.اسم;
 document.getElementById('mPrice').innerText=p.سعر+' درهم'; document.getElementById('mDesc').innerText=p.وصف;
 document.getElementById('waBtn').onclick=()=>window.open('https://wa.me/212600000000?text=بغيت '+encodeURIComponent(p.اسم),'_blank');
 const th=document.getElementById('mThumbs'); th.innerHTML='';
 p.صور.forEach((s,idx)=>{
  const im=document.createElement('img'); im.src=s; if(idx==0) im.classList.add('active');
  im.onclick=()=>{document.getElementById('mImg').src=s; th.querySelectorAll('img').forEach(x=>x.classList.remove('active')); im.classList.add('active');};
  th.appendChild(im);
 });
}
fetch('products.json?v='+Date.now()).then(r=>r.json()).then(d=>{all=d; show(d);});
</script>
</body>
</html>
