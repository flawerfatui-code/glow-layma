name: تحديث المنتجات
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: شغلي البوت
        run: python bot.py
      - name: حفظي
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add products.json
          git diff --staged --quiet || git commit -m "update"
          git push
