name: Update Products

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run bot
        run: python bot.py
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add products.json
          git diff --staged --quiet || git commit -m "update products"
          git push
