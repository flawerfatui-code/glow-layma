name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add products.json
          git commit -m "update products" || echo "no changes"
          git push
