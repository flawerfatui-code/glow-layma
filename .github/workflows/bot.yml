name: منتجات روبوتية
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python bot.py
      - run: |
          git config --local user.email "bot@glowlayma.com"
          git config --local user.name "Glow Layma Bot"
          git add .
          git commit -m "تحديث" || exit 0
          git push
